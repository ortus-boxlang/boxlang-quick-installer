name: BoxLang Quick Installers Release

on:
  workflow_run:
    workflows: [Test Installers]
    types: [completed]
    branches:
      - main
      - development
  workflow_dispatch:

# Cancel running builds if another push to branch is made while this build is running
concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
    cancel-in-progress: true

env:
  RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  SNAPSHOT: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'development' }}

jobs:
  publish:
    name: Build & Publish
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # add write permissions
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read Version File
        id: version
        run: |
          INSTALLER_VERSION=$(jq -r '.INSTALLER_VERSION' version.json)
          echo "INSTALLER_VERSION=${INSTALLER_VERSION}" >> $GITHUB_ENV
          echo "installer_version=${INSTALLER_VERSION}" >> $GITHUB_OUTPUT

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        # If NOT a env.snapshot
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ steps.version.outputs.installer_version }}

      - name: Fix Markdown on Changelog
        if: env.SNAPSHOT == 'false'
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix

      - name: Build the Installer
        run: |
          ./build.sh ${{ env.SNAPSHOT == 'true' && '--snapshot' || '' }}

      - name: Commit Changelog [unreleased] with latest version
        uses: EndBug/add-and-commit@v11.1.1
        if: env.SNAPSHOT == 'false'
        with:
          author_name: Github Actions
          author_email: lmajano@ortussolutions.com
          message: "Finalized changelog for v${{ steps.version.outputs.installer_version }}"
          push: origin HEAD:${{ env.RELEASE_BRANCH }}
          add: changelog.md

      - name: Tag Version
        uses: rickstaa/action-create-tag@v1.7.2
        if: env.SNAPSHOT == 'false'
        with:
          tag: "v${{ steps.version.outputs.installer_version }}"
          force_push_tag: true
          message: "Latest Release v${{ steps.version.outputs.installer_version }}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            build/**
            changelog.md

      - name: Upload Distributions to S3
        uses: jakejarvis/s3-sync-action@master
        if: success()
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/"
          DEST_DIR: ${{ env.SNAPSHOT == 'true' && 'ortussolutions/boxlang-quick-installer/snapshot/' || 'ortussolutions/boxlang-quick-installer' }}

      - name: Invalidate CloudFront Cache
        if: env.RELEASE_BRANCH == 'main'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          CLOUDFRONT_DISTRIBUTION_DOWNLOADS: ${{ secrets.CLOUDFRONT_DISTRIBUTION_DOWNLOADS }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_DOWNLOADS" \
            --paths "/ortussolutions/boxlang-quick-installer/*"

      - name: Create Github Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        if: env.SNAPSHOT == 'false'
        continue-on-error: true
        id: create_release
        with:
          title: ${{ steps.version.outputs.installer_version }}
          changelog: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ steps.version.outputs.installer_version }}

      - name: Inform Slack
        if: ${{ always() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "BoxLang ${{ steps.version.outputs.installer_version }} Built with ${{ job.status }}!"
          SLACK_TITLE: "BoxLang Build"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: needs.publish.result == 'success' && (github.event.workflow_run.head_branch || github.ref_name) != 'development'
    runs-on: ubuntu-latest
    needs: [publish]
    # add write permissions
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout Development Repository
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .tmp

      - name: Copy Changelog
        run: |
          cp -vf .tmp/changelog.md changelog.md

      - name: Bump Version
        run: |
          ./bump.sh
          git pull

      - name: Commit
        uses: EndBug/add-and-commit@v10.0.0
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Version bump"
          add: |
            version.json
            changelog.md

  ##########################################################################################
  # Notify Homebrew Tap
  ##########################################################################################
  notify_homebrew:
    name: Notify Homebrew Tap
    if: needs.publish.result == 'success' && (github.event.workflow_run.head_branch || github.ref_name) != 'development'
    runs-on: ubuntu-latest
    needs: [publish]
    permissions: {}
    steps:
      - name: Dispatch Homebrew Tap Update
        run: |
          curl -fsSL -X POST https://api.github.com/repos/ortus-boxlang/homebrew-boxlang/actions/workflows/update-formulas.yml/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GHA_WORKFLOW_DISPATCHER_PAT_BOXLANG }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{ "ref":"main" }'
